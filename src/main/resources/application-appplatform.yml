# ============================================================
#  App Platform profile — DigitalOcean App Platform production
# ============================================================
# Activated when SPRING_PROFILES_ACTIVE=appplatform.
#
# Required environment variables in App Platform:
#
#  App:
#    SPRING_PROFILES_ACTIVE=appplatform
#    JAVA_OPTS=-Xms128m -Xmx384m
#
#  Database:
#    DB_HOSTNAME, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#
#  Redis / Upstash:
#    REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, REDIS_SSL
#
#  Kafka / Confluent Cloud:
#    KAFKA_BOOTSTRAP_SERVERS
#    KAFKA_USERNAME
#    KAFKA_PASSWORD
#    KAFKA_GROUP_ID
#    KAFKA_TOPIC_TRANSACTIONS
#    KAFKA_SECURITY_PROTOCOL=SASL_SSL
#    KAFKA_SASL_MECHANISM=PLAIN
#
#  Secrets:
#    JWT_SECRET, GROK_API_KEY

server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  # ---------- PostgreSQL / DigitalOcean Dev Database ----------
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT}/${DB_DATABASE}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  # ---------- Redis / Upstash ----------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 5000ms

  # ---------- Kafka / Confluent Cloud ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    # Common Kafka security config.
    # This applies to producer, consumer and admin clients.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";'

    admin:
      fail-fast: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

    consumer:
      group-id: ${KAFKA_GROUP_ID:bankradar-risk-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: az.bankradar.transaction
        spring.json.value.default.type: az.bankradar.transaction.TransactionEvent
        spring.json.use.type.headers: false

  # ---------- GraphiQL disabled in production ----------
  graphql:
    graphiql:
      enabled: false

# ---------- Application properties ----------
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

  grok:
    api-url: ${GROK_API_URL:https://api.groq.com/openai/v1/chat/completions}
    api-key: ${GROK_API_KEY:}
    model: ${GROK_MODEL:llama-3.1-8b-instant}

  kafka:
    topics:
      transactions: ${KAFKA_TOPIC_TRANSACTIONS:bankradar.transactions}
      transactions-dlq: ${KAFKA_TOPIC_TRANSACTIONS_DLQ:bankradar.transactions.dlq}

  fraud:
    velocity-threshold: ${FRAUD_VELOCITY_THRESHOLD:5}
    velocity-window-seconds: ${FRAUD_VELOCITY_WINDOW_SECONDS:60}
    high-amount-threshold: ${FRAUD_HIGH_AMOUNT_THRESHOLD:10000}
    llm-borderline-min: ${FRAUD_LLM_BORDERLINE_MIN:40}
    llm-borderline-max: ${FRAUD_LLM_BORDERLINE_MAX:70}

# ---------- gRPC ----------
# DigitalOcean App Platform exposes one HTTP port.
# gRPC server is disabled in production profile.
grpc:
  server:
    port: -1

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,metrics
  endpoint:
    health:
      show-details: always

# ---------- Logging ----------
logging:
  level:
    root: INFO
    az.bankradar: INFO
    org.springframework: WARN
    org.springframework.kafka: WARN
    io.github.resilience4j: WARN
    org.hibernate: WARN